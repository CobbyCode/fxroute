# FXRoute installer seed pointer (removed on the installed system by
# late-commands). cloud-init NoCloud reads user-data/meta-data from the ISO
# tree; the squashfs seed dir is unusable (shadowed by empty upper-layer
# placeholders), and kernel-cmdline seedfrom does not survive casper.
datasource:
  NoCloud:
    seedfrom: file:///cdrom/fxroute-seed/
