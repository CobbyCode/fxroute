<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160">
  <!-- Quiet FXRoute appliance wallpaper, matching the Web-UI shell:
       near-black base, faint mint lift at the top, centered route-mark
       lockup. No tagline, no waveform, no tile. Rasterized to PNG for KDE. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0b0e"/>
      <stop offset="55%" stop-color="#0d0d10"/>
      <stop offset="100%" stop-color="#0b0b0e"/>
    </linearGradient>
    <radialGradient id="lift" cx="0.5" cy="0" r="0.55">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.035"/>
      <stop offset="100%" stop-color="#6ee7b7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="3840" height="2160" fill="url(#bg)"/>
  <rect width="3840" height="2160" fill="url(#lift)"/>

  <!-- Centered canonical lockup (route-mark + FXRoute), small on purpose. -->
  <g transform="translate(1456 996) scale(4)" opacity="0.92">
    <g stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M6 23V12a3 3 0 0 1 3-3h13" stroke="#6ee7b7" stroke-width="2.5"/>
      <path d="M10 23h13a3 3 0 0 0 3-3V9" stroke="#ececf0" stroke-width="2.5"/>
      <circle cx="6" cy="23" r="3" fill="#6ee7b7" stroke="none"/>
      <circle cx="26" cy="9" r="3" fill="#ececf0" stroke="none"/>
    </g>
    <text x="44" y="23.5" font-family="Geist, Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" letter-spacing="-0.045em" fill="#ececf0">
      <tspan font-weight="740">FX</tspan><tspan font-weight="520">Route</tspan>
    </text>
  </g>
</svg>
